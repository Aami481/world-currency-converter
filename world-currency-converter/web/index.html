<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Currency Converter</title>
<style>
:root{--card:rgba(255,255,255,.93);--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--chip:#f1f5f9;--res:#ecfdf5;--acc:#059669;--acc2:#0d9488;--pop:#fff}
@media(prefers-color-scheme:dark){:root{--card:rgba(15,23,42,.85);--ink:#f1f5f9;--mut:#94a3b8;--line:#334155;--chip:#1e293b;--res:#0b2e2a;--pop:#0f172a}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px 14px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,#0d9488 0,transparent 40%),radial-gradient(circle at 85% 90%,#6366f1 0,transparent 45%),#0f172a}
.card{width:100%;max-width:520px;background:var(--card);backdrop-filter:blur(14px);border-radius:24px;padding:28px;box-shadow:0 25px 60px rgba(0,0,0,.35)}
header{text-align:center;margin-bottom:22px}
.logo{width:52px;height:52px;margin:0 auto 10px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),#6366f1)}
h1{font-size:1.5rem;letter-spacing:-.02em}
header p{color:var(--mut);font-size:.9rem;margin-top:4px}
label{display:block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 6px}
.amt{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;padding:0 14px;background:var(--chip);transition:.2s}
.amt:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px rgba(5,150,105,.15)}
.amt.bad{border-color:#ef4444}
.amt b{color:var(--acc);font-size:1.1rem;margin-right:8px}
#amount{flex:1;border:0;background:none;font-size:1.7rem;font-weight:700;padding:12px 0;color:var(--ink);outline:none;min-width:0}
.chips{display:flex;gap:8px;margin:10px 0 18px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:5px 12px;border-radius:99px;font-size:.82rem;cursor:pointer}
.chips button:hover{border-color:var(--acc);color:var(--acc)}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.combo{position:relative}
.combo>button{width:100%;display:flex;align-items:center;gap:7px;padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--chip);color:var(--ink);cursor:pointer;font-size:.95rem;text-align:left}
.combo>button:hover,.combo.open>button{border-color:var(--acc)}
.combo>button span{color:var(--mut);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.combo i{width:9px;height:9px;border-radius:50%;flex:none}
.menu{display:none;position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);background:var(--pop);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.25);overflow:hidden;min-width:250px}
.combo.open .menu{display:block}
.menu input{width:100%;border:0;border-bottom:1px solid var(--line);padding:12px;font-size:.95rem;background:none;color:var(--ink);outline:none}
.menu ul{list-style:none;max-height:240px;overflow:auto;padding:4px}
.menu li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:.9rem}
.menu li:hover,.menu li.on{background:var(--chip)}
.menu li span{flex:1;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu li small{color:var(--mut);font-size:.7rem}
.menu li.none{color:var(--mut);cursor:default}
#swap{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;color:#fff;font-size:1.2rem;background:linear-gradient(135deg,var(--acc),var(--acc2));transition:transform .4s;margin-bottom:2px}
#swap:hover{box-shadow:0 6px 16px rgba(5,150,105,.45)}
.result{margin-top:22px;padding:22px;border-radius:18px;background:var(--res);text-align:center;border:1px solid rgba(5,150,105,.25)}
.result small{color:var(--mut);font-size:.9rem}
#out{font-size:2.3rem;font-weight:800;color:var(--acc);margin:6px 0 2px;word-break:break-all;letter-spacing:-.02em}
#outc{font-size:.85rem;color:var(--mut)}
.rates{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.rates span{background:var(--pop);border:1px solid var(--line);padding:5px 12px;border-radius:99px;font-size:.8rem}
#copy{margin-top:14px;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;padding:10px 22px;border-radius:12px;font-weight:600;cursor:pointer}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 10px}
#pop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#pop button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:10px 6px;cursor:pointer;text-align:center}
#pop button:hover{border-color:var(--acc)}
#pop b{display:block;font-size:.78rem;color:var(--mut)}
#pop span{font-weight:700;font-size:.9rem;word-break:break-all}
footer{margin-top:20px;text-align:center;font-size:.76rem;color:var(--mut);line-height:1.5}
@media(max-width:480px){.pair{grid-template-columns:1fr}#swap{justify-self:center;margin:2px 0;transform:rotate(90deg)}.card{padding:20px}#out{font-size:1.8rem}}
</style>
</head>
<body>
<main class="card">
  <header>
    <div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"/></svg></div>
    <h1>World Currency Converter</h1>
    <p id="sub"></p>
  </header>

  <label for="amount">Amount</label>
  <div class="amt" id="amtBox"><b id="cur">INR</b><input id="amount" inputmode="decimal" value="1000" autocomplete="off"></div>
  <div class="chips"><button data-v="100">100</button><button data-v="1000">1,000</button><button data-v="10000">10,000</button><button data-v="100000">1,00,000</button></div>

  <div class="pair">
    <div><label>From</label><div class="combo" id="cf"><button type="button"></button><div class="menu"><input placeholder="Search code or name..."><ul></ul></div></div></div>
    <button id="swap" title="Swap currencies" aria-label="Swap currencies">&#8644;</button>
    <div><label>To</label><div class="combo" id="ct"><button type="button"></button><div class="menu"><input placeholder="Search code or name..."><ul></ul></div></div></div>
  </div>

  <section class="result">
    <small id="line">&nbsp;</small>
    <div id="out">--</div>
    <div id="outc">&nbsp;</div>
    <div class="rates"><span id="rate"></span><span id="inv"></span></div>
    <button id="copy">Copy result</button>
  </section>

  <h2>Same amount in popular currencies</h2>
  <div id="pop"></div>

  <footer>Live mid-market rates when online, otherwise the saved snapshot shown above.<br>Indicative rates, not for trading. Data: open currency-api.</footer>
</main>

const M=Object.fromEntries(R.map(r=>[r[0],r]));
const COL={"Americas":"#22c55e","Europe":"#3b82f6","Asia":"#eab308","Middle East":"#a855f7","Africa":"#ef4444","Oceania":"#06b6d4"};
const $=s=>document.querySelector(s);
let from="INR",to="USD";
const conv=(a,f,t)=>a/M[f][3]*M[t][3];
const nf=(v,d)=>v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const money=v=>nf(v,Math.abs(v)>=1||v===0?2:6);
const rt=v=>nf(v,v>=100?2:v>=1?4:6);
const SNAP="2026-10-29";
$("#sub").textContent=R.length+" currencies · offline rates of "+SNAP;
async function live(){
  const urls=["https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json","https://latest.currency-api.pages.dev/v1/currencies/usd.json"];
  for(const u of urls){
    try{
      const r=await fetch(u,{cache:"no-store"});if(!r.ok)continue;
      const j=await r.json();let n=0;
      R.forEach(x=>{const v=j.usd&&j.usd[x[0].toLowerCase()];if(v>0){x[3]=v;n++}});
      if(n>100){$("#sub").textContent=R.length+" currencies · live rates · "+j.date;update();return}
    }catch(_){}
  }
}

function combo(el,get,set){
  const btn=el.querySelector("button"),menu=el.querySelector(".menu"),inp=menu.querySelector("input"),list=menu.querySelector("ul");
  const dot=r=>`<i style="background:${COL[r[2]]}"></i>`;
  function fill(q){
    q=q.toLowerCase();
    list.innerHTML=R.filter(r=>r[0].toLowerCase().includes(q)||r[1].toLowerCase().includes(q))
      .map(r=>`<li data-c="${r[0]}"${r[0]===get()?' class="on"':''}>${dot(r)}<b>${r[0]}</b><span>${r[1]}</span><small>${r[2]}</small></li>`).join("")||'<li class="none">No match</li>';
  }
  const pick=c=>{set(c);el.classList.remove("open")};
  btn.onclick=e=>{
    e.stopPropagation();
    document.querySelectorAll(".combo").forEach(x=>x!==el&&x.classList.remove("open"));
    if(el.classList.toggle("open")){inp.value="";fill("");inp.focus();const on=list.querySelector(".on");if(on)list.scrollTop=on.offsetTop-90}
  };
  menu.onclick=e=>e.stopPropagation();
  list.onclick=e=>{const li=e.target.closest("li[data-c]");if(li)pick(li.dataset.c)};
  inp.oninput=()=>fill(inp.value);
  inp.onkeydown=e=>{if(e.key==="Escape")el.classList.remove("open");if(e.key==="Enter"){const li=list.querySelector("li[data-c]");if(li)pick(li.dataset.c)}};
  return ()=>{const r=M[get()];btn.innerHTML=`${dot(r)}<b>${r[0]}</b><span>${r[1]}</span>`};
}
const paintF=combo($("#cf"),()=>from,c=>{from=c;update()});
const paintT=combo($("#ct"),()=>to,c=>{to=c;update()});
document.addEventListener("click",()=>document.querySelectorAll(".combo").forEach(x=>x.classList.remove("open")));

function amount(){const v=parseFloat($("#amount").value.replace(/,/g,""));return isFinite(v)&&v>0&&v<=1e12?v:NaN}

function update(){
  paintF();paintT();
  $("#cur").textContent=from;
  const a=amount(),ok=!isNaN(a);
  $("#amtBox").classList.toggle("bad",!ok&&$("#amount").value.trim()!=="");
  $("#rate").textContent=`1 ${from} = ${rt(conv(1,from,to))} ${to}`;
  $("#inv").textContent=`1 ${to} = ${rt(conv(1,to,from))} ${from}`;
  if(!ok){$("#out").textContent="--";$("#line").innerHTML="Enter a positive amount";$("#outc").innerHTML="&nbsp;";$("#pop").innerHTML="";return}
  $("#line").textContent=`${money(a)} ${from} =`;
  $("#out").textContent=money(conv(a,from,to))+" "+to;
  $("#outc").textContent=M[to][1];
  const P=["USD","EUR","GBP","JPY","AED","CAD","AUD","SGD","INR"].filter(c=>c!==from).slice(0,6);
  $("#pop").innerHTML=P.map(c=>`<button data-c="${c}"><b>${c}</b><span>${money(conv(a,from,c))}</span></button>`).join("");
}

$("#amount").oninput=update;
document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{$("#amount").value=b.dataset.v;update()});
$("#pop").onclick=e=>{const b=e.target.closest("button[data-c]");if(b){to=b.dataset.c;update()}};
$("#swap").onclick=e=>{[from,to]=[to,from];const s=e.currentTarget;s.style.transform+=" rotate(180deg)";update()};
$("#copy").onclick=async e=>{
  const t=$("#line").textContent+" "+$("#out").textContent;
  try{await navigator.clipboard.writeText(t);e.target.textContent="Copied!"}catch(_){e.target.textContent="Press Ctrl+C"}
  setTimeout(()=>e.target.textContent="Copy result",1400);
};
update();
live();
</script>
</body>
</html>
